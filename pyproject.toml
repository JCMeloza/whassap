[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "whatsapp-transfer-backend"
version = "1.0.0"
description = "Python backend for WhatsApp Transfer Tool — ADB-based Android data migration"
authors = [
    {name = "Gentle Programming", email = "dev@gentleprogramming.com"},
]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "psutil>=5.9",
]

[project.urls]
Homepage = "https://github.com/gentleprogramming/whatsapp-transfer"
BugTracker = "https://github.com/gentleprogramming/whatsapp-transfer/issues"

[tool.setuptools]
packages = ["backend"]
